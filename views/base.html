<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#33502c">
    <title>{% block title %}Catálogo de Gatos{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/cat-line.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script>
        (function () {
            if (localStorage.getItem('modo-campo') === 'escuro') document.documentElement.dataset.theme = 'dark';
        }());
    </script>
</head>
<body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo principal</a>
    <div class="page-loader" role="status" aria-label="Carregando catálogo"><span></span></div>
    <header><h1><img class="brand-mark" src="{{ url_for('static', filename='img/cat-line.svg') }}" alt=""> Catálogo de Raças de Gatos</h1></header>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid px-0">
            <a class="navbar-brand" href="{{ url_for('animals') }}"><img src="{{ url_for('static', filename='img/cat-line.svg') }}" alt="" class="nav-mark"> Catálogo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="menuPrincipal"><ul class="navbar-nav ms-auto align-items-lg-center"><li class="nav-item"><a class="nav-link" href="{{ url_for('animals') }}">Raças</a></li><li class="nav-item"><a class="nav-link" href="{{ url_for('galeria') }}">Galeria</a></li><li class="nav-item"><a class="nav-link" href="{{ url_for('favoritos') }}">Favoritos <span class="nav-counter">{{ favoritos_count }}</span></a></li><li class="nav-item nav-more"><button class="nav-link nav-more-button" type="button" aria-expanded="false">Mais <span aria-hidden="true">⌄</span></button><div class="nav-more-menu"><a href="{{ url_for('estatisticas') }}">Estatísticas</a><a href="{{ url_for('mapa') }}">Mapa de origens</a></div></li><li class="nav-item"><button class="theme-toggle" type="button" id="themeToggle" aria-label="Ativar modo noturno" aria-pressed="false"><span aria-hidden="true">☾</span><span class="theme-label">Modo noturno</span></button></li></ul></div>
        </div>
    </nav>
    <main id="main-content" tabindex="-1">{% block content %}{% endblock content %}</main>
    <div class="toast-message" id="globalToast" role="status" aria-live="polite"></div>
    <footer><p>&copy; 2026 · Catálogo de Gatos · Feito com carinho para quem ama felinos.</p></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('load', function () { document.body.classList.add('page-ready'); });
        const toggle = document.getElementById('themeToggle');
        function syncThemeButton() {
            const dark = document.documentElement.dataset.theme === 'dark';
            toggle.setAttribute('aria-pressed', String(dark));
            toggle.setAttribute('aria-label', dark ? 'Ativar modo claro' : 'Ativar modo noturno');
            toggle.querySelector('span').textContent = dark ? '☀' : '☾';
            toggle.querySelector('.theme-label').textContent = dark ? 'Modo claro' : 'Modo noturno';
        }
        syncThemeButton();
        toggle.addEventListener('click', function () {
            const dark = document.documentElement.dataset.theme === 'dark';
            document.documentElement.dataset.theme = dark ? 'light' : 'dark';
            localStorage.setItem('modo-campo', dark ? 'claro' : 'escuro');
            syncThemeButton();
        });
        const moreButton = document.querySelector('.nav-more-button');
        if (moreButton) moreButton.addEventListener('click', function () { const open = this.parentElement.classList.toggle('open'); this.setAttribute('aria-expanded', String(open)); });
        const globalToast = document.getElementById('globalToast');
        function showToast(message, error) { globalToast.textContent = message; globalToast.classList.toggle('toast-error', Boolean(error)); globalToast.classList.add('show'); window.setTimeout(() => globalToast.classList.remove('show'), 2600); }
        document.querySelectorAll('.ajax-favorite').forEach(function (form) { form.addEventListener('submit', async function (event) { event.preventDefault(); const button = form.querySelector('button'); button.disabled = true; try { const response = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: {'X-Requested-With': 'XMLHttpRequest'} }); const data = await response.json(); if (!response.ok) throw new Error(data.message); document.querySelectorAll('.nav-counter').forEach(counter => counter.textContent = data.count); button.classList.add('saved'); button.textContent = '♥'; button.title = 'Já está nos favoritos'; showToast(data.message, false); } catch (error) { button.disabled = false; showToast(error.message || 'Não foi possível favoritar agora.', true); } }); });
    </script>
</body>
</html>
